services:
  registry:
    image: voxacommunications-registry:latest
    container_name: voxa-registry
    depends_on:
      - registry-mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=registry
      - FLASK_ENV=production
      - SSL_CERT_PATH=/app/certs/cert.pem
      - SSL_KEY_PATH=/app/certs/key.pem
    ports:
      - "3300:3300"
      - "443:443"  # HTTPS port
    volumes:
      - logs/registry:/logs:ro
      - ./certs:/app/certs:ro  # Mount SSL certificates

  registry-mysql:
    image: mysql:8.0
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=registry
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: